<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Continentix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="sq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a7bff"/>
      <stop offset="1" stop-color="#0a5be6"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f86ff"/>
      <stop offset="1" stop-color="#0d63f0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <g transform="translate(80 60)">
      <rect x="2" y="2" width="196" height="196" rx="36" fill="url(#sq)" stroke="#bfe0ff" stroke-width="2.5"/>
      <circle cx="96" cy="102" r="67" fill="#0b1a33"/>
      <circle cx="124" cy="102" r="59" fill="url(#inner)" stroke="#d8ecff" stroke-width="2.8"/>
    </g>
    <text x="320" y="152" font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="600" letter-spacing="-1.5" fill="#f8fafc">continentix</text>
    <text x="324" y="196" font-family="Inter, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" letter-spacing="0.5" fill="#94a3b8">global infrastructure holding</text>
    <text x="324" y="232" font-family="Inter, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#64748b">Continent-scale infrastructure — from the first commit.</text>
  </g>
</svg>
